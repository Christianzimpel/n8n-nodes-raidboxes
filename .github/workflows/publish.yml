# Publishes to npm with provenance (required for n8n community node verification).
# Trigger: create a GitHub release with a tag like v0.2.1 that matches package.json.
# Setup once: add an npm automation token as repository secret NPM_TOKEN.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Check tag matches package.json
        run: test "v$(node -p 'require(\"./package.json\").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
